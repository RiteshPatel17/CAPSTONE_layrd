# ─────────────────────────────────────────────
# LÄYRD – full-stack local Docker setup
# Brings up the Next.js app + all 4 microservices with one command:
#   docker compose up --build
#
# Secrets come from each service's own existing .env.local (via env_file)
# — nothing is hardcoded or baked into these files or into the images.
# The environment: overrides below only replace the *_SERVICE_URL values,
# which have to point at Docker's internal service names instead of
# "localhost" once everything is networked together in containers.
# ─────────────────────────────────────────────
services:
  delivery-fee-service:
    build: ./microservices/delivery-fee-service
    env_file: ./microservices/delivery-fee-service/.env.local
    ports:
      - "3001:3001"
    restart: unless-stopped

  promo-code-service:
    build: ./microservices/promo-code-service
    env_file: ./microservices/promo-code-service/.env.local
    ports:
      - "3002:3002"
    restart: unless-stopped

  notifications-service:
    build: ./microservices/notifications-service
    env_file: ./microservices/notifications-service/.env.local
    ports:
      - "3003:3003"
    restart: unless-stopped

  ai-label-service:
    build: ./microservices/ai-label-service
    env_file: ./microservices/ai-label-service/.env.local
    ports:
      - "3004:3004"
    restart: unless-stopped

  layrd-ecommerce:
    build: ./layrd-ecommerce
    env_file: ./layrd-ecommerce/.env.local
    environment:
      DELIVERY_SERVICE_URL: http://delivery-fee-service:3001
      PROMO_SERVICE_URL: http://promo-code-service:3002
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3003
      AI_LABEL_SERVICE_URL: http://ai-label-service:3004
    ports:
      - "3000:3000"
    depends_on:
      - delivery-fee-service
      - promo-code-service
      - notifications-service
      - ai-label-service
    restart: unless-stopped
